[tools]
go = "latest"
rust = "latest"
java = "latest"
ruby = "latest"
node = "latest"
elixir = "latest"
erlang = "latest"
python = "latest"
"npm:agent-ste" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"cargo:https://github.com/kaofelix/greprip-rs" = "branch:main"
# The engine of the impeccable skill in pi/skills. Its release tags start with
# engine-v, and its version moves with the skill copy.
"github:pbakaus/impeccable" = { version = "0.1.8", version_prefix = "engine-v" }

[settings]
idiomatic_version_file_enable_tools = ["elixir", "go", "java", "node", "python", "ruby", "terraform", "yarn"]
activate_aggressive = true
npm.shell_out = true
disable_update_warning = true
minimum_release_age_excludes = ["npm:@earendil-works/pi-coding-agent"]
auto_update = false
exec_auto_install = false
not_found_auto_install = false
prefer_offline = false
